<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">Dead Bug – zwei Bewegungspositionen</title><desc id="d">Seitenansicht in Rückenlage: Start mit angewinkelten Hüften und Knien und Armen zur Decke; danach ein Bein und der gegenüberliegende Arm kontrolliert strecken. Schematische Trainingsgrafik.</desc><rect width="720" height="300" rx="20" fill="#0b1722"/><g font-family="system-ui,sans-serif" font-size="20" fill="#f0f6fa"><text x="30" y="35">1 · Ausgangsposition</text><text x="390" y="35">2 · Diagonal strecken</text></g><g stroke="#4c7286" stroke-width="3"><path d="M25 244H335M385 244H695"/></g><g fill="none" stroke="#e7f0f4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M100 214L205 214L237 176L237 113M180 214L200 163L257 163M150 211L160 143"/><path d="M456 214L554 214L605 222L657 222M526 214L552 166L573 116M499 211L464 159"/></g><g fill="#e7f0f4"><circle cx="83" cy="214" r="17"/><circle cx="439" cy="214" r="17"/></g><g fill="none" stroke="#ef6464" stroke-width="7" stroke-linecap="round"><path d="M136 209L191 209M491 209L544 209"/></g><g fill="#9fd6f5" font-family="system-ui,sans-serif" font-size="16"><text x="31" y="276">Lendenbereich kontrolliert</text><text x="390" y="276">Langsam, ohne Hohlkreuz</text></g><path d="M347 145h25m-8-8 8 8-8 8" stroke="#69d9ee" stroke-width="4" fill="none"/></svg>